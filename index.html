<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6d600">
<title>こども将棋ものがたり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap">
<style>
/* Layout: the booth poster in phone form — key visual and outlined catch line on flat yellow, the story on a cream panel below */
:root {
  --yellow: #f6d600;
  --cream: #f6faed;
  --ink: #231815;
  --red: #d14237;
  --blue: #118fc4;
  --marker: #e4d01c;
  --white: #ffffff;
  --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--yellow); }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--yellow);
  color: var(--ink);
  font-family: var(--font);
  font-weight: 500;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust: 100%;
}
.hero { max-width: 36rem; margin: 0 auto; padding-top: 14px; }
.kv { display: block; width: 100%; height: auto; }

/* ポスターと同じ、黒フチ文字のキャッチ */
.catch {
  margin: 6px auto 18px;
  text-align: center;
  font-weight: 900;
  font-size: clamp(1.45rem, 7.4vw, 2.1rem);
  line-height: 1.3;
  letter-spacing: 0.02em;
  color: var(--white);
  --o: 0.09em;
  text-shadow:
    var(--o) 0 0 var(--ink), calc(var(--o) * -1) 0 0 var(--ink), 0 var(--o) 0 var(--ink), 0 calc(var(--o) * -1) 0 var(--ink),
    calc(var(--o) * .7) calc(var(--o) * .7) 0 var(--ink), calc(var(--o) * -.7) calc(var(--o) * .7) 0 var(--ink),
    calc(var(--o) * .7) calc(var(--o) * -.7) 0 var(--ink), calc(var(--o) * -.7) calc(var(--o) * -.7) 0 var(--ink),
    calc(var(--o) * 1.6) calc(var(--o) * 1.6) 0 var(--ink);
  transform: rotate(-2deg);
}
.catch .red { color: var(--red); }

.panel {
  max-width: 34rem;
  margin: 0 auto;
  background: var(--cream);
  border-radius: 32px;
  padding: 30px clamp(20px, 6vw, 34px) 32px;
  display: grid;
  gap: 24px;
}
.head { display: grid; justify-items: start; gap: 12px; }
.pill {
  display: inline-block;
  margin: 0;
  font-weight: 800;
  font-size: 0.875rem;
  letter-spacing: 0.04em;
  color: var(--white);
  background: var(--red);
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 3px 14px 4px;
}
h1 {
  margin: 0;
  font-weight: 900;
  font-size: clamp(1.5rem, 6.6vw, 2rem);
  line-height: 1.45;
  color: var(--blue);
  overflow-wrap: anywhere;
}
/* 蛍光ペンのような黄色いマーカー（改行しても各行に引かれる） */
h1 span {
  background: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 92%, transparent 92%);
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  padding: 0 0.1em;
}
.story { display: grid; gap: 1.1em; }
.story p {
  margin: 0;
  font-size: 1.0625rem;
  line-height: 2.05;
  letter-spacing: 0.02em;
  text-indent: 1em;
  overflow-wrap: anywhere;
}
.notice p { margin: 0; font-size: 1rem; line-height: 1.9; }

/* 黒いラベル付きの枠（ポスターの「体験時間」と同じ形） */
.box {
  position: relative;
  border: 2px solid var(--ink);
  border-radius: 16px;
  padding: 24px 18px 18px;
  margin-top: 10px;
  display: grid;
  gap: 14px;
}
.tab {
  position: absolute;
  top: -0.95em;
  left: 14px;
  margin: 0;
  font-weight: 800;
  font-size: 0.875rem;
  color: var(--white);
  background: var(--ink);
  border-radius: 999px;
  padding: 2px 14px 3px;
}
.box p { margin: 0; font-size: 0.9375rem; line-height: 1.85; }
.box strong { color: var(--red); font-weight: 800; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
button {
  font-family: var(--font);
  font-weight: 800;
  font-size: 1rem;
  letter-spacing: 0.04em;
  color: var(--white);
  background: var(--red);
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 11px 24px 12px;
  cursor: pointer;
  touch-action: manipulation;
}
button:active { filter: brightness(0.92); }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.status { font-size: 0.875rem; font-weight: 800; min-height: 1.4em; }
.small { text-align: center; font-size: 0.75rem; font-weight: 800; margin: 18px 0 0; }
</style>
</head>
<body>
<header class="hero">
  <img class="kv" src="keyvisual.png" width="1200" height="600" alt="こども将棋ものがたり">
</header>

<p class="catch" aria-hidden="true">あなたの棋譜が<span class="red">物語</span>に！</p>

<main class="panel" aria-live="polite">
  <div class="head">
    <p class="pill" id="pill">あなただけの小さな物語</p>
    <h1><span id="title">物語を読み込んでいます</span></h1>
  </div>

  <section class="story" id="story" hidden></section>
  <section class="notice" id="notice" hidden>
    <p id="noticeText"></p>
  </section>

  <section class="box" id="foot" hidden>
    <p class="tab">物語をとっておくには</p>
    <p>この物語は<strong>どこにも保存されていません</strong>。このページのアドレスの中にだけ入っています。スクリーンショットを撮るか、このページをブックマークして残してください。</p>
    <div class="actions">
      <button type="button" id="copy">物語をコピー</button>
      <span class="status" id="status" role="status"></span>
    </div>
  </section>
</main>

<p class="small">こども将棋ものがたり</p>

<script>
(() => {
  // URLの「#」以降: 先頭1文字が形式の版番号、残りが base64url(deflate-raw(UTF-8のJSON))
  // JSON: { "v": 1, "t": "タイトル", "s": "物語本文" }
  const MAX_TITLE = 80, MAX_STORY = 3000;
  const $ = (id) => document.getElementById(id);

  const showError = (message) => {
    $('title').textContent = '物語を表示できませんでした';
    $('pill').hidden = true;
    $('noticeText').textContent = message;
    $('notice').hidden = false;
    $('story').hidden = true;
    $('foot').hidden = true;
  };

  const fromBase64Url = (text) => {
    const b64 = text.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((text.length + 3) % 4);
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  };

  const inflate = async (bytes) => {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(stream).text();
  };

  const render = (data) => {
    // 受け取った文字列は必ず textContent で入れる（URLは誰でも書き換えられるため）
    $('title').textContent = data.t;
    const story = $('story');
    story.replaceChildren();
    data.s.split(/\n+/).map((line) => line.trim()).filter(Boolean).forEach((line) => {
      const p = document.createElement('p');
      p.textContent = line;
      story.append(p);
    });
    $('pill').hidden = false;
    story.hidden = false;
    $('foot').hidden = false;
    $('notice').hidden = true;
    document.title = data.t + '｜こども将棋ものがたり';
  };

  const load = async () => {
    const raw = location.hash.replace(/^#/, '');
    if (!raw) {
      showError('物語のデータが見つかりません。会場のiPadに表示されたQRコードを、もう一度スマートフォンで読み取ってください。');
      return;
    }
    if (typeof DecompressionStream === 'undefined') {
      showError('お使いのブラウザでは表示できません。ブラウザを最新版に更新してから、もう一度QRコードを読み取ってください。');
      return;
    }
    try {
      if (raw[0] !== '1') throw new Error('unknown version');
      const data = JSON.parse(await inflate(fromBase64Url(raw.slice(1))));
      if (typeof data.t !== 'string' || typeof data.s !== 'string') throw new Error('bad shape');
      if (data.t.length > MAX_TITLE || data.s.length > MAX_STORY) throw new Error('too long');
      render(data);
    } catch (e) {
      showError('QRコードの読み取りが途中で切れた可能性があります。会場のiPadに表示されたQRコードを、もう一度読み取ってください。');
    }
  };

  $('copy').addEventListener('click', async () => {
    const text = $('title').textContent + '\n\n' + [...$('story').querySelectorAll('p')].map((p) => p.textContent).join('\n');
    try {
      await navigator.clipboard.writeText(text);
      $('status').textContent = 'コピーしました';
    } catch (e) {
      const range = document.createRange();
      range.selectNodeContents($('story'));
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      $('status').textContent = '本文を選択しました。長押しでコピーできます';
    }
  });

  window.addEventListener('hashchange', load);
  load();
})();
</script>
</body>
</html>
